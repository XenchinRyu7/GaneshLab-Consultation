<div style="font-family: &quot;Segoe UI&quot;, Arial; background-color: #f9f9f9; padding: 20px">
  <div style="max-width: 500px; margin: auto; background: #fff; border-radius: 8px; overflow: hidden">
    <div style="background-color: #004aad; color: white; padding: 16px">
      <h2>Selamat Datang, ${name}!</h2>
    </div>
    <div style="padding: 16px">
      <p>Akun kamu telah dibuat dengan detail berikut:</p>
      <table style="width: 100%; border-collapse: collapse">
        <tr>
          <td><strong>Email:</strong></td>
          <td>${email}</td>
        </tr>
        <tr>
          <td><strong>Password:</strong></td>
          <td>${password}</td>
        </tr>
      </table>
      <a
        href="${process.env.BASE_URL_LOGIN_NEXT}"
        style="
          display: inline-block;
          margin-top: 20px;
          padding: 10px 20px;
          background-color: #004aad;
          color: white;
          text-decoration: none;
          border-radius: 5px;
        "
        >Login Sekarang</a
      >
      <p style="margin-top: 20px; font-size: 12px; color: #888">Jika kamu tidak merasa mendaftar, abaikan email ini.</p>
    </div>
  </div>
</div>
