name: ganeshlab-consultation-dashboard

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ganeshlab-consultation-dashboard
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Named volumes for node_modules and .next (exclude from host)
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - ganeshlab-consultation-network

volumes:
  # Named volumes with clear names
  node_modules:
    driver: local
  next_cache:
    driver: local

networks:
  ganeshlab-consultation-network:
    driver: bridge
