name: ganeshlab-consultation-dashboard

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ganeshlab-consultation-dashboard
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Exclude node_modules from host, use container's node_modules
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - ganeshlab-consultation-network
networks:
  ganeshlab-consultation-network:
    driver: bridge

